<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحات التحليل</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14202b;--mut:#64748b;--ac:#2563eb;--bd:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#e8eef6;--mut:#94a3b8;--bd:#334155}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top,0)}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.top h1{font-size:17px;margin:0}.top nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.top nav a{padding:5px 12px;border-radius:999px;background:var(--bg);color:var(--tx);text-decoration:none;font-size:13px;border:1px solid var(--bd)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--ac);color:#fff}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
input{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);direction:ltr}
#login{max-width:340px;margin:12vh auto;background:var(--card);padding:24px;border-radius:14px;border:1px solid var(--bd);display:flex;flex-direction:column;gap:10px}
#login h2{margin:0}#msg{color:#c0392b;font-size:13px;min-height:18px}
main{max-width:1400px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:18px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)}
.ph h2{margin:0;font-size:16px}.ph a{color:var(--ac);font-size:13px;margin-inline-start:12px}
iframe{width:100%;min-height:600px;border:0;display:block}
#admin{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;align-items:center}
.hide{display:none!important}
</style>
</head>
<body>
<div id="login" class="hide">
 <h2>لوحات التحليل</h2>
 <div style="color:var(--mut);font-size:14px">سجّل الدخول مرة واحدة للوصول إلى كل اللوحات.</div>
 <input id="em" type="email" placeholder="البريد الإلكتروني">
 <input id="pw" type="password" placeholder="كلمة المرور">
 <button id="in">تسجيل الدخول</button><button id="up" class="g">إنشاء حساب</button>
 <div id="msg"></div>
</div>
<div id="app" class="hide">
 <div class="top"><h1>لوحات التحليل</h1><nav id="nav"></nav><span id="who" style="font-size:12px;color:var(--mut)"></span><button id="out" class="g">خروج</button></div>
 <main>
  <div id="admin" class="hide">
   <b>إضافة لوحة:</b>
   <input id="nt" placeholder="اسم اللوحة" style="direction:rtl">
   <input id="nf" placeholder="اسم الملف مثل: new_panel.html">
   <button id="na">إضافة</button>
  </div>
  <div id="panels" style="display:contents"></div>
 </main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyB7glXXENZ1f9YiP9_MK-Cbfu0mY7HlUUs",authDomain:"daya-analysis.firebaseapp.com",projectId:"daya-analysis",storageBucket:"daya-analysis.firebasestorage.app",messagingSenderId:"1045002113390",appId:"1:1045002113390:web:1885b8849e39b789be317f"};
/* إيميلات الإدارة: وحّدها مع القواعد في Firebase */
const ADMINS=["manger@gmail.com"];
/* اللوحات الأساسية. أي لوحة جديدة تُضاف من الصفحة نفسها */
const DEFAULT_PANELS=[
 {id:"syoula",title:"syoula",src:"syoula_dashboard.html"},
 {id:"survey",title:"survey",src:"survey.html"},
 {id:"down",title:"down service",src:"downtime.html"}
];
const $=id=>document.getElementById(id);
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
let extra=[],unsub=null,sigShown="",isAdmin=false;
const okSrc=s=>/^[\w\-. ()%\u0600-\u06FF]+\.html?$/i.test(s||"");
function list(){return DEFAULT_PANELS.concat(extra.slice().sort((a,b)=>(a.order||0)-(b.order||0)))}
function render(){
 const L=list(),sig=JSON.stringify(L)+isAdmin;
 if(sig===sigShown)return;sigShown=sig;
 const box=$("panels"),nav=$("nav");box.innerHTML="";nav.innerHTML="";
 L.forEach(p=>{
  if(!okSrc(p.src))return;
  const a=document.createElement("a");a.href="#"+p.id;a.textContent=p.title;nav.appendChild(a);
  const s=document.createElement("section");s.id=p.id;
  const h=document.createElement("div");h.className="ph";
  const t=document.createElement("h2");t.textContent=p.title;
  const r=document.createElement("span");
  const o=document.createElement("a");o.textContent="فتح في صفحة";o.target="_blank";o.href=encodeURI(p.src);r.appendChild(o);
  if(isAdmin&&p.docId){const d=document.createElement("a");d.textContent="حذف";d.href="#";d.onclick=e=>{e.preventDefault();if(confirm("حذف لوحة "+p.title+"؟"))db.collection("panels").doc(p.docId).delete()};r.appendChild(d)}
  h.append(t,r);
  const f=document.createElement("iframe");f.src=encodeURI(p.src);f.title=p.title;f.loading="lazy";
  s.append(h,f);box.appendChild(s);
 });
 if(location.hash){const e=document.getElementById(location.hash.slice(1));if(e)e.scrollIntoView()}
}
setInterval(()=>document.querySelectorAll("iframe").forEach(f=>{try{const d=f.contentDocument,h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0);if(h>200&&Math.abs(f.offsetHeight-h)>8)f.style.height=h+"px"}catch(e){}}),1500);
auth.onAuthStateChanged(u=>{
 $("login").classList.toggle("hide",!!u);$("app").classList.toggle("hide",!u);
 if(unsub){unsub();unsub=null}
 if(!u){sigShown="";$("panels").innerHTML="";return}
 isAdmin=ADMINS.includes((u.email||"").toLowerCase());
 $("who").textContent=u.email;$("admin").classList.toggle("hide",!isAdmin);
 render();
 unsub=db.collection("panels").onSnapshot(s=>{extra=[];s.forEach(d=>{const x=d.data();extra.push({id:"p_"+d.id,docId:d.id,title:x.title,src:x.src,order:x.order})});render()},e=>console.warn("panels:",e.code));
});
const go=fn=>auth[fn]($("em").value.trim(),$("pw").value).catch(e=>{$("msg").textContent=e.code+" "+e.message});
$("in").onclick=()=>go("signInWithEmailAndPassword");
$("up").onclick=()=>go("createUserWithEmailAndPassword");
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go("signInWithEmailAndPassword")});
$("out").onclick=()=>auth.signOut();
$("na").onclick=async()=>{
 const t=$("nt").value.trim(),f=$("nf").value.trim();
 if(!t||!okSrc(f)){alert("اكتب اسم اللوحة واسم ملف صحيح ينتهي بـ .html");return}
 try{await db.collection("panels").add({title:t,src:f,order:Date.now(),by:auth.currentUser.email});$("nt").value=$("nf").value=""}catch(e){alert(e.code||e.message)}
};
</script>
</body>
</html>
