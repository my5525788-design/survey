<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحات التحليل</title>
<style>
:root{--bg:#0e1a17;--bar:#142522;--br:#2c4540;--tx:#e6f1ee;--mut:#93aaa4;--pr:#2fb68c;--prt:#06231b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--br);flex-wrap:wrap}
nav b{color:var(--pr);font-size:15px;margin-inline-end:8px}
nav button{font:inherit;font-size:14px;cursor:pointer;color:var(--pr);background:transparent;border:1px solid var(--pr);border-radius:8px;padding:7px 14px}
nav button.on{background:var(--pr);color:var(--prt)}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
</style>
</head>
<body>
<nav>
 <b>لوحات التحليل</b>
 <button id="bS" data-t="survey">📋 استبيان رضا العملاء</button>
 <button id="bD" data-t="downtime">📉 تحليل الداون تايم</button>
</nav>
<main>
 <iframe id="fS" title="استبيان رضا العملاء" data-src="survey.html"></iframe>
 <iframe id="fD" title="تحليل الداون تايم" data-src="downtime.html"></iframe>
</main>
<script>
const tabs={survey:{b:document.getElementById("bS"),f:document.getElementById("fS")},downtime:{b:document.getElementById("bD"),f:document.getElementById("fD")}};
function show(t){
 if(!tabs[t])t="survey";
 for(const k in tabs){
  const on=k===t;tabs[k].b.classList.toggle("on",on);tabs[k].f.classList.toggle("on",on);
  if(on&&!tabs[k].f.src)tabs[k].f.src=tabs[k].f.dataset.src;
 }
 try{history.replaceState(null,"","#"+t)}catch(e){location.hash=t}
}
tabs.survey.b.onclick=()=>show("survey");tabs.downtime.b.onclick=()=>show("downtime");
show((location.hash||"").slice(1)||"survey");
window.addEventListener("hashchange",()=>show((location.hash||"").slice(1)));
</script>
</body>
</html>
