<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحات التحليل</title>
<style>
:root{--bg:#0e1a17;--bar:#142522;--br:#2c4540;--tx:#e6f1ee;--mut:#93aaa4;--pr:#2fb68c;--prt:#06231b;--er:#ff7a6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--br);flex-wrap:wrap}
nav b{color:var(--pr);font-size:15px;margin-inline-end:8px}
nav button{font:inherit;font-size:14px;cursor:pointer;color:var(--pr);background:transparent;border:1px solid var(--pr);border-radius:8px;padding:7px 14px}
nav button.on{background:var(--pr);color:var(--prt)}
.sp{flex:1}
#who{font-size:12px;color:var(--mut);direction:ltr}
nav button.out{border-color:var(--br);color:var(--mut);padding:5px 10px;font-size:12px}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
#gate{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:420px;background:#182c28;border:1px solid var(--br);border-radius:12px;padding:20px}
.box h2{margin:0 0 6px;font-size:18px;color:var(--pr)}
.box p{margin:0 0 14px;font-size:13px;color:var(--mut)}
.box input{width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid var(--br);background:#10201d;color:var(--tx);font-size:15px;direction:ltr}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1;padding:10px;border-radius:8px;font:inherit;font-size:15px;cursor:pointer}
#gLogin{border:0;background:var(--pr);color:var(--prt)}
#gReg{border:1px solid var(--pr);background:transparent;color:var(--pr)}
#gMsg{margin-top:10px;font-size:13px;color:var(--er);min-height:18px}
</style>
</head>
<body>
<div id="gate"><div class="box">
 <h2>لوحات التحليل</h2>
 <p>سجّل الدخول مرة واحدة للوصول إلى كل اللوحات.</p>
 <input id="gEmail" type="email" placeholder="Email / البريد الإلكتروني" autocomplete="username">
 <input id="gPass" type="password" placeholder="Password / كلمة المرور" autocomplete="current-password">
 <div class="row"><button id="gLogin">تسجيل الدخول</button><button id="gReg">إنشاء حساب</button></div>
 <div id="gMsg"></div>
</div></div>
<nav id="nav"><b>لوحات التحليل</b></nav>
<main id="main"></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const FBCFG={apiKey:"AIzaSyB7glXXENZ1f9YiP9_MK-Cbfu0mY7HlUUs",authDomain:"daya-analysis.firebaseapp.com",projectId:"daya-analysis",storageBucket:"daya-analysis.firebasestorage.app",messagingSenderId:"1045002113390",appId:"1:1045002113390:web:1885b8849e39b789be317f"};
const $=id=>document.getElementById(id);
const DEFAULT=[{id:"survey",title:"استبيان رضا العملاء",icon:"📋",file:"survey.html"},{id:"downtime",title:"تحليل الداون تايم",icon:"📉",file:"downtime.html"}];
const nav=$("nav"),main=$("main"),tabs={};let order=[],authed=false;
function build(list){
 list.forEach(p=>{
  if(!p||!p.id||!p.file||tabs[p.id])return;
  const b=document.createElement("button");b.textContent=(p.icon?p.icon+" ":"")+(p.title||p.id);b.onclick=()=>show(p.id);nav.appendChild(b);
  const f=document.createElement("iframe");f.title=p.title||p.id;f.dataset.src=p.file;main.appendChild(f);
  tabs[p.id]={b,f};order.push(p.id);
 });
 const sp=document.createElement("span");sp.className="sp";nav.appendChild(sp);
 const who=document.createElement("span");who.id="who";nav.appendChild(who);
 const out=document.createElement("button");out.className="out";out.id="out";out.textContent="تسجيل الخروج";out.style.display="none";out.onclick=()=>auth.signOut();nav.appendChild(out);
}
function show(t){
 if(!order.length)return;
 if(!tabs[t])t=order[0];
 for(const k in tabs){const on=k===t;tabs[k].b.classList.toggle("on",on);tabs[k].f.classList.toggle("on",on);if(on&&authed&&!tabs[k].f.getAttribute("src"))tabs[k].f.src=tabs[k].f.dataset.src}
 try{history.replaceState(null,"","#"+t)}catch(e){location.hash=t}
}
const cur=()=>(location.hash||"").slice(1);
let auth;
const errAr=e=>({"auth/invalid-email":"البريد الإلكتروني غير صحيح","auth/user-not-found":"لا يوجد حساب بهذا البريد","auth/wrong-password":"كلمة المرور غير صحيحة","auth/invalid-credential":"بيانات الدخول غير صحيحة","auth/email-already-in-use":"هذا البريد مسجل بالفعل","auth/weak-password":"كلمة المرور يجب ألا تقل عن 6 أحرف","auth/network-request-failed":"تحقق من اتصال الإنترنت"}[e.code]||e.message||"خطأ");
async function go(create){
 const em=$("gEmail").value.trim(),pw=$("gPass").value;
 if(!em||!pw){$("gMsg").textContent="أدخل البريد الإلكتروني وكلمة المرور";return}
 $("gMsg").textContent="";
 try{create?await auth.createUserWithEmailAndPassword(em,pw):await auth.signInWithEmailAndPassword(em,pw)}catch(e){$("gMsg").textContent=errAr(e)}
}
async function init(){
 let list=DEFAULT;
 try{const r=await fetch("panels.json?"+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length)list=j}}catch(e){}
 build(list);
 try{firebase.initializeApp(FBCFG);auth=firebase.auth();auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){$("gMsg").textContent="تعذر بدء الاتصال: "+e.message;return}
 $("gLogin").onclick=()=>go(false);$("gReg").onclick=()=>go(true);
 $("gPass").addEventListener("keydown",e=>{if(e.key==="Enter")go(false)});
 auth.onAuthStateChanged(u=>{
  authed=!!u;
  $("gate").style.display=u?"none":"flex";
  $("who").textContent=u?(u.email||""):"";
  $("out").style.display=u?"":"none";
  if(u)show(cur());
  else for(const k in tabs){tabs[k].f.removeAttribute("src")}
 });
 show(cur());
}
window.addEventListener("hashchange",()=>show(cur()));
init();
</script>
</body>
</html>
