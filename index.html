<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحات التحليل</title>
<style>
:root{--bg:#0e1a17;--bar:#142522;--br:#2c4540;--tx:#e6f1ee;--mut:#93aaa4;--pr:#2fb68c;--prt:#06231b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--br);flex-wrap:wrap}
nav b{color:var(--pr);font-size:15px;margin-inline-end:8px}
nav button{font:inherit;font-size:14px;cursor:pointer;color:var(--pr);background:transparent;border:1px solid var(--pr);border-radius:8px;padding:7px 14px}
nav button.on{background:var(--pr);color:var(--prt)}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
</style>
</head>
<body>
<nav id="nav"><b>لوحات التحليل</b></nav>
<main id="main"></main>
<script>
const DEFAULT=[{id:"survey",title:"استبيان رضا العملاء",icon:"📋",file:"survey.html"},{id:"downtime",title:"تحليل الداون تايم",icon:"📉",file:"downtime.html"}];
const nav=document.getElementById("nav"),main=document.getElementById("main"),tabs={};let order=[];
function build(list){
 list.forEach(p=>{
  if(!p||!p.id||!p.file||tabs[p.id])return;
  const b=document.createElement("button");b.textContent=(p.icon?p.icon+" ":"")+(p.title||p.id);b.onclick=()=>show(p.id);nav.appendChild(b);
  const f=document.createElement("iframe");f.title=p.title||p.id;f.dataset.src=p.file;main.appendChild(f);
  tabs[p.id]={b,f};order.push(p.id);
 });
}
function show(t){
 if(!tabs[t])t=order[0];
 for(const k in tabs){const on=k===t;tabs[k].b.classList.toggle("on",on);tabs[k].f.classList.toggle("on",on);if(on&&!tabs[k].f.getAttribute("src"))tabs[k].f.src=tabs[k].f.dataset.src}
 try{history.replaceState(null,"","#"+t)}catch(e){location.hash=t}
}
async function init(){
 let list=DEFAULT;
 try{const r=await fetch("panels.json?"+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length)list=j}}catch(e){}
 build(list);show((location.hash||"").slice(1));
}
window.addEventListener("hashchange",()=>show((location.hash||"").slice(1)));
init();
</script>
</body>
</html>
